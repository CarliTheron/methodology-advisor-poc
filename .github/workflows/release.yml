name: Release

# Runs at the end of a sprint, after the sprint review, either when a version tag
# (v*) is pushed or when a release is published from the GitHub website (which
# creates the tag). The tag must match advisor.__version__. Each release counts as
# one deployment in tools/collect_metrics.py.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and attach, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository at the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          version=$(python -c "import advisor; print(advisor.__version__)")
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt build

      - name: Re-run quality gates on the tagged commit
        run: |
          ruff check .
          ruff format --check .
          python -m advisor validate-rules
          pytest --cov --cov-fail-under=90

      - name: Build wheel and source distribution (rules bundled in the package)
        run: |
          cp config/rules.json src/advisor/rules.json
          python -m build

      - name: Check the wheel works outside the repository
        run: |
          check() {
            code=0; out=$("$@" 2>&1) || code=$?
            echo "$out"
            if [ $code -ne 0 ]; then
              echo "::error title=Wheel check::$* failed ($code): $(echo "$out" | tail -n 6 | tr '\n' ' ')"
              exit $code
            fi
          }
          ls -l dist
          echo "::notice title=Wheel contents::$(python -m zipfile -l dist/*.whl | awk '{print $1}' | tr '\n' ' ')"
          echo "::notice title=Build tools::$(python -m pip list 2>/dev/null | grep -iE '^(setuptools|build|pip) ' | tr '\n' ' ')"
          check python -m pip install dist/*.whl
          echo "::notice title=pip show::$(python -m pip show methodology-advisor 2>&1 | tr '\n' ' ')"
          cd "$RUNNER_TEMP"
          echo "::notice title=sys.path::$(env -u PYTHONPATH python -c 'import sys, importlib.util; print(sys.executable, sys.path, importlib.util.find_spec("advisor"))' 2>&1 | tr '\n' ' ')"
          check env -u PYTHONPATH python -m advisor recommend --volatility high --team-size 6 \
            --regulation none --release-frequency high --maturity medium --distributed-team no

      - name: Record the evaluation results for this version
        run: |
          python -m advisor check-scenarios --input evaluation/scenarios.json \
            --expected evaluation/expectations.json > dist/evaluation-${TAG}.md
          python -m advisor sensitivity --input evaluation/scenarios.json --step 2 \
            >> dist/evaluation-${TAG}.md

      - name: Publish GitHub release, or attach files to the one created on the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "Methodology Advisor ${TAG}" \
              --generate-notes --verify-tag
          fi
